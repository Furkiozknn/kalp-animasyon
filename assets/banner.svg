<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a0a1f"/>
      <stop offset="55%" stop-color="#0c0512"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5fd1"/>
      <stop offset="45%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#ffd76d"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9fe0"/>
      <stop offset="50%" stop-color="#caa5ff"/>
      <stop offset="100%" stop-color="#ffd76d"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="60" r="1.3" opacity="0.8"/>
    <circle cx="180" cy="140" r="1" opacity="0.5"/>
    <circle cx="260" cy="50" r="1.5" opacity="0.7"/>
    <circle cx="120" cy="300" r="1.1" opacity="0.6"/>
    <circle cx="1000" cy="70" r="1.3" opacity="0.8"/>
    <circle cx="1090" cy="160" r="1" opacity="0.5"/>
    <circle cx="1140" cy="300" r="1.5" opacity="0.7"/>
    <circle cx="960" cy="330" r="1.1" opacity="0.6"/>
  </g>

  <!-- glowing heart, drawn with two arcs + point, offset left of title block for balance -->
  <g transform="translate(150,150)" filter="url(#glow)">
    <path d="M0,26 C-34,-8 -70,4 -70,34 C-70,64 -34,84 0,116 C34,84 70,64 70,34 C70,4 34,-8 0,26 Z"
          fill="none" stroke="url(#heartGrad)" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <text x="660" y="185" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="900" font-size="78" fill="url(#title)" filter="url(#softglow)" letter-spacing="6">My Universe</text>

  <text x="660" y="232" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="700" font-size="19" fill="#e2d4eb" letter-spacing="4" opacity="0.85">A GLOWING 3D HEART WOVEN FROM LIGHT, IN A LIVING STARFIELD</text>

  <text x="600" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" fill="#f5e9e9" opacity="0.95">✨ Real Bloom &#160;&#160;&#160; 🌌 Parallax Starfield &#160;&#160;&#160; 💫 Shooting Stars &#160;&#160;&#160; 🖱️ Scroll to Zoom</text>
</svg>
