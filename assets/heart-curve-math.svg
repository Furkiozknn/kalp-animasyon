<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#1a0a1f"/>
      <stop offset="55%" stop-color="#0c0512"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="mHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5fd1"/>
      <stop offset="45%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#ffd76d"/>
    </linearGradient>
    <linearGradient id="mTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9fe0"/>
      <stop offset="50%" stop-color="#caa5ff"/>
      <stop offset="100%" stop-color="#ffd76d"/>
    </linearGradient>
    <filter id="mGlowBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mGlowDot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#mbg)"/>
  <g fill="#ffffff">
    <circle cx="60" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="150" cy="470" r="1.3" opacity="0.6"/>
    <circle cx="1130" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="1080" cy="490" r="1.4" opacity="0.6"/>
    <circle cx="600" cy="40" r="1" opacity="0.5"/>
  </g>

  <text x="600" y="66" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="url(#mTitleGrad)" filter="url(#mGlowSoft)" letter-spacing="3">The Curve Beneath the Light</text>
  <text x="600" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#cbb8d8" opacity="0.85" letter-spacing="1.5">bir avuç ışıktan örülen kalp &#8212; the same 180-point parametric curve, before and after it becomes the ribbon</text>

  <!-- LEFT: scattered light, the curve as raw points -->
  <g transform="translate(300,320) scale(0.86)">
    <circle r="150" fill="none" stroke="#e2d4eb" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 6"/>
    <g stroke="#e2d4eb" stroke-opacity="0.14" stroke-width="1" fill="none">
      <path d="M 0,-35.4 L 3.03,-48.65 L 23.98,-74.44 L 60.46,-85.41 L 99.37,-67.44 L 115.32,-28.99 L 98.64,13.28 L 61.6,51.23 L 22.91,84.88 L 3.55,111.33 L 0.24,121.93 L -3.93,111.6 L -22.8,85.38 L -61.4,51.9 L -99.07,14.02 L -114.85,-28.3 L -99.67,-66.89 L -60.44,-85.07 L -23.69,-74.37 L -3.49,-48.85 Z"/>
    </g>
    <g filter="url(#mGlowDot)">
      <circle cx="0" cy="-35.4" r="4.6" fill="#ff6fd4"/>
      <circle cx="3.03" cy="-48.65" r="3.8" fill="#ff7fd8"/>
      <circle cx="23.98" cy="-74.44" r="4.2" fill="#f584de"/>
      <circle cx="60.46" cy="-85.41" r="4" fill="#e08fef"/>
      <circle cx="99.37" cy="-67.44" r="4.4" fill="#c99cf7"/>
      <circle cx="115.32" cy="-28.99" r="4" fill="#b6a5ff"/>
      <circle cx="98.64" cy="13.28" r="4.2" fill="#c8b4ff"/>
      <circle cx="61.6" cy="51.23" r="3.8" fill="#dcbfff"/>
      <circle cx="22.91" cy="84.88" r="4.4" fill="#ecc7f0"/>
      <circle cx="3.55" cy="111.33" r="4" fill="#ffd0b8"/>
      <circle cx="0.24" cy="121.93" r="4.8" fill="#ffd76d"/>
      <circle cx="-3.93" cy="111.6" r="4" fill="#ffcf8c"/>
      <circle cx="-22.8" cy="85.38" r="4.4" fill="#f7bfa0"/>
      <circle cx="-61.4" cy="51.9" r="3.8" fill="#e6a6c8"/>
      <circle cx="-99.07" cy="14.02" r="4.2" fill="#d68fd6"/>
      <circle cx="-114.85" cy="-28.3" r="4" fill="#c081e8"/>
      <circle cx="-99.67" cy="-66.89" r="4.4" fill="#ab86f2"/>
      <circle cx="-60.44" cy="-85.07" r="4" fill="#9d8bf5"/>
      <circle cx="-23.69" cy="-74.37" r="4.2" fill="#f36fc9"/>
      <circle cx="-3.49" cy="-48.85" r="3.8" fill="#ff67cf"/>
    </g>
  </g>
  <text x="300" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#cbb8d8" opacity="0.75" letter-spacing="0.5">180 points on load &#8226; scattered</text>

  <!-- ARROW -->
  <g transform="translate(600,320)" filter="url(#mGlowSoft)">
    <line x1="-60" y1="0" x2="60" y2="0" stroke="url(#mHeartGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 44,-13 L 66,0 L 44,13" fill="none" stroke="url(#mHeartGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#a691b8" letter-spacing="2" opacity="0.8">TUBEGEOMETRY</text>

  <!-- RIGHT: the woven ribbon -->
  <g transform="translate(900,320) scale(0.86)">
    <circle r="150" fill="none" stroke="#e2d4eb" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2 6"/>
    <path filter="url(#mGlowBig)" fill="none" stroke="url(#mHeartGrad)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"
      d="M 0,-35.4 L 3.03,-48.65 L 23.98,-74.44 L 60.46,-85.41 L 99.37,-67.44 L 115.32,-28.99 L 98.64,13.28 L 61.6,51.23 L 22.91,84.88 L 3.55,111.33 L 0.24,121.93 L -3.93,111.6 L -22.8,85.38 L -61.4,51.9 L -99.07,14.02 L -114.85,-28.3 L -99.67,-66.89 L -60.44,-85.07 L -23.69,-74.37 L -3.49,-48.85 Z"/>
    <!-- t markers at the four cardinal parameter points -->
    <g font-family="'Courier New', monospace" font-size="13" fill="#e8d9f5" opacity="0.9">
      <circle cx="0" cy="-35.4" r="2.4" fill="#fff" opacity="0.8"/>
      <text x="12" y="-42" opacity="0.85">t=0</text>
      <circle cx="115.32" cy="-28.99" r="2.4" fill="#fff" opacity="0.8"/>
      <text x="122" y="-30" opacity="0.85">t=&#960;/2</text>
      <circle cx="0.24" cy="121.93" r="2.4" fill="#fff" opacity="0.8"/>
      <text x="-14" y="145" opacity="0.85">t=&#960;</text>
      <circle cx="-114.85" cy="-28.3" r="2.4" fill="#fff" opacity="0.8"/>
      <text x="-172" y="-30" opacity="0.85">t=3&#960;/2</text>
    </g>
  </g>
  <text x="900" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#cbb8d8" opacity="0.75" letter-spacing="0.5">320 tubular segments &#8226; woven into one ribbon</text>

  <!-- formulas -->
  <rect x="220" y="524" width="760" height="1" fill="#e2d4eb" opacity="0.12"/>
  <text x="600" y="552" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#f0e3ff" opacity="0.92" letter-spacing="0.5">x(t) = 16&#183;sin&#179;t &#160;&#160;&#160;&#160; y(t) = 13&#183;cos t &#8722; 5&#183;cos 2t &#8722; 2&#183;cos 3t &#8722; cos 4t &#160;&#160;&#160;&#160; t &#8712; [0, 2&#960;)</text>
</svg>
