<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <radialGradient id="fbg" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#1a0a1f"/>
      <stop offset="55%" stop-color="#0c0512"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="fIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5fd1"/>
      <stop offset="45%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#ffd76d"/>
    </linearGradient>
    <linearGradient id="fIconGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd76d"/>
      <stop offset="55%" stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#ff5fd1"/>
    </linearGradient>
    <filter id="fGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fCardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#fbg)"/>
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.1" opacity="0.6"/>
    <circle cx="1160" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="600" cy="20" r="1" opacity="0.5"/>
  </g>

  <!-- 4 feature cards, evenly spaced -->
  <!-- card frame template repeated at x = 40, 320, 600, 880 (width 260) -->
  <g id="cards" font-family="Orbitron, 'Segoe UI', sans-serif">

    <!-- 1: BLOOM -->
    <g transform="translate(40,50)">
      <rect width="260" height="230" rx="20" fill="#0c0414" stroke="#7a5a92" stroke-opacity="0.35" stroke-width="1"/>
      <g transform="translate(130,95)">
        <circle r="30" fill="url(#fIconGrad)" filter="url(#fCardGlow)" opacity="0.9"/>
        <circle r="30" fill="url(#fIconGrad)"/>
        <circle r="46" fill="none" stroke="url(#fIconGrad)" stroke-width="1.4" opacity="0.45"/>
        <circle r="60" fill="none" stroke="url(#fIconGrad)" stroke-width="1" opacity="0.25"/>
      </g>
      <text x="130" y="182" text-anchor="middle" font-weight="700" font-size="18" fill="#f2e6ff" letter-spacing="1">BLOOM</text>
      <text x="130" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="400" font-size="11.5" fill="#b7a3c8" letter-spacing="0.3">UnrealBloomPass, not a blur hack</text>
    </g>

    <!-- 2: PARALLAX -->
    <g transform="translate(320,50)">
      <rect width="260" height="230" rx="20" fill="#0c0414" stroke="#7a5a92" stroke-opacity="0.35" stroke-width="1"/>
      <g transform="translate(130,95)" filter="url(#fGlowSoft)">
        <rect x="-40" y="-8" width="80" height="34" rx="6" fill="none" stroke="#ffd76d" stroke-width="2" opacity="0.55"/>
        <rect x="-30" y="-18" width="80" height="34" rx="6" fill="none" stroke="#b06bff" stroke-width="2" opacity="0.75"/>
        <rect x="-20" y="-28" width="80" height="34" rx="6" fill="none" stroke="#ff5fd1" stroke-width="2.4"/>
        <g stroke="#e8d9f5" stroke-width="1.4" opacity="0.5">
          <line x1="-60" y1="4" x2="-46" y2="4"/>
          <path d="M -50,0 L -46,4 L -50,8" fill="none"/>
        </g>
      </g>
      <text x="130" y="182" text-anchor="middle" font-weight="700" font-size="18" fill="#f2e6ff" letter-spacing="1">PARALLAX</text>
      <text x="130" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="400" font-size="11.5" fill="#b7a3c8" letter-spacing="0.3">camera drifts with mouse, touch &amp; scroll</text>
    </g>

    <!-- 3: STARFIELD -->
    <g transform="translate(600,50)">
      <rect width="260" height="230" rx="20" fill="#0c0414" stroke="#7a5a92" stroke-opacity="0.35" stroke-width="1"/>
      <g transform="translate(130,95)" filter="url(#fGlow)" fill="#fff2e0">
        <circle cx="0" cy="0" r="3.2"/>
        <circle cx="-24" cy="14" r="1.6" opacity="0.85"/>
        <circle cx="22" cy="-16" r="1.8" opacity="0.9"/>
        <circle cx="-16" cy="-20" r="1.3" opacity="0.7"/>
        <circle cx="28" cy="16" r="1.5" opacity="0.8"/>
        <circle cx="-34" cy="-4" r="1.2" opacity="0.6"/>
        <circle cx="10" cy="26" r="1.3" opacity="0.7"/>
      </g>
      <text x="130" y="182" text-anchor="middle" font-weight="700" font-size="18" fill="#f2e6ff" letter-spacing="1">STARFIELD</text>
      <text x="130" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="400" font-size="11.5" fill="#b7a3c8" letter-spacing="0.3">900 depth-layered, twinkling points</text>
    </g>

    <!-- 4: SHOOTING STARS -->
    <g transform="translate(880,50)">
      <rect width="260" height="230" rx="20" fill="#0c0414" stroke="#7a5a92" stroke-opacity="0.35" stroke-width="1"/>
      <g transform="translate(130,95) rotate(-28)" filter="url(#fGlow)">
        <line x1="-40" y1="0" x2="34" y2="0" stroke="url(#fIconGrad2)" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
        <circle cx="36" cy="0" r="4.4" fill="#fff7ec"/>
      </g>
      <text x="130" y="182" text-anchor="middle" font-weight="700" font-size="18" fill="#f2e6ff" letter-spacing="1">SHOOTING STARS</text>
      <text x="130" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="400" font-size="11.5" fill="#b7a3c8" letter-spacing="0.3">rare streaks, up to 4 live at once</text>
    </g>

  </g>
</svg>
