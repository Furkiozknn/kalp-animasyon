<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <radialGradient id="cbg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#1a0a1f"/>
      <stop offset="55%" stop-color="#0c0512"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="cTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9fe0"/>
      <stop offset="50%" stop-color="#caa5ff"/>
      <stop offset="100%" stop-color="#ffd76d"/>
    </linearGradient>
    <linearGradient id="journeyBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff5fd1"/>
      <stop offset="25%"  stop-color="#b06bff"/>
      <stop offset="50%"  stop-color="#ffd76d"/>
      <stop offset="75%"  stop-color="#b06bff"/>
      <stop offset="100%" stop-color="#ff5fd1"/>
    </linearGradient>
    <filter id="cGlowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cGlowBar" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cGlowDot" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#cbg)"/>
  <g fill="#ffffff">
    <circle cx="50" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="140" cy="90" r="1" opacity="0.5"/>
    <circle cx="1150" cy="50" r="1.3" opacity="0.7"/>
    <circle cx="1080" cy="100" r="1" opacity="0.5"/>
  </g>

  <text x="600" y="64" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="800" font-size="32" fill="url(#cTitleGrad)" filter="url(#cGlowSoft)" letter-spacing="3">A Slow Aurora Drift</text>
  <text x="600" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14.5" fill="#cbb8d8" opacity="0.85" letter-spacing="1">the ribbon's hue breathes back and forth along this exact path &#8212; never crossing into green</text>

  <!-- the gradient bar itself, glowing like the ribbon -->
  <rect x="120" y="168" width="960" height="26" rx="13" fill="url(#journeyBar)" filter="url(#cGlowBar)"/>
  <rect x="120" y="168" width="960" height="26" rx="13" fill="url(#journeyBar)"/>

  <!-- comet trail implying the back-and-forth drift -->
  <g filter="url(#cGlowDot)">
    <circle cx="600" cy="181" r="9" fill="#fff7ec"/>
    <circle cx="560" cy="181" r="5.5" fill="#ffe9c4" opacity="0.55"/>
    <circle cx="640" cy="181" r="5.5" fill="#ffe9c4" opacity="0.55"/>
    <circle cx="510" cy="181" r="3.5" fill="#ffe9c4" opacity="0.3"/>
    <circle cx="690" cy="181" r="3.5" fill="#ffe9c4" opacity="0.3"/>
  </g>
  <text x="600" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="12.5" fill="#f0e3ff" opacity="0.75">hueShift = sin(t &#215; 0.12) &#215; 20&#176; &#8226; a ~52s breath</text>

  <!-- stop markers -->
  <g font-family="'Courier New', monospace" font-size="13" fill="#e8d9f5">
    <line x1="120" y1="196" x2="120" y2="212" stroke="#e8d9f5" stroke-opacity="0.4"/>
    <text x="120" y="234" text-anchor="middle" opacity="0.9">0.00</text>
    <text x="120" y="254" text-anchor="middle" fill="#ff9fe0" opacity="0.95">magenta</text>
    <text x="120" y="272" text-anchor="middle" fill="#a691b8" opacity="0.8" font-size="11">330&#176;</text>

    <line x1="360" y1="196" x2="360" y2="212" stroke="#e8d9f5" stroke-opacity="0.4"/>
    <text x="360" y="234" text-anchor="middle" opacity="0.9">0.25</text>
    <text x="360" y="254" text-anchor="middle" fill="#caa5ff" opacity="0.95">violet</text>
    <text x="360" y="272" text-anchor="middle" fill="#a691b8" opacity="0.8" font-size="11">285&#176;</text>

    <line x1="600" y1="196" x2="600" y2="212" stroke="#e8d9f5" stroke-opacity="0.4"/>
    <text x="600" y="234" text-anchor="middle" opacity="0.9">0.50</text>
    <text x="600" y="254" text-anchor="middle" fill="#ffd76d" opacity="0.95">gold</text>
    <text x="600" y="272" text-anchor="middle" fill="#a691b8" opacity="0.8" font-size="11">42&#176;</text>

    <line x1="840" y1="196" x2="840" y2="212" stroke="#e8d9f5" stroke-opacity="0.4"/>
    <text x="840" y="234" text-anchor="middle" opacity="0.9">0.75</text>
    <text x="840" y="254" text-anchor="middle" fill="#caa5ff" opacity="0.95">violet</text>
    <text x="840" y="272" text-anchor="middle" fill="#a691b8" opacity="0.8" font-size="11">285&#176;</text>

    <line x1="1080" y1="196" x2="1080" y2="212" stroke="#e8d9f5" stroke-opacity="0.4"/>
    <text x="1080" y="234" text-anchor="middle" opacity="0.9">1.00</text>
    <text x="1080" y="254" text-anchor="middle" fill="#ff9fe0" opacity="0.95">magenta</text>
    <text x="1080" y="272" text-anchor="middle" fill="#a691b8" opacity="0.8" font-size="11">330&#176;</text>
  </g>

  <text x="600" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#9c86ac" opacity="0.8" letter-spacing="0.5">renk asla yeşile dokunmaz &#8212; same journey traced along the ribbon and every dust mote</text>
</svg>
