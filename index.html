<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">

<meta property="og:description" content="My Universe — a glowing 3D heart, beating in its own galaxy.">
<meta property="og:image" content="https://furkiozknn.github.io/kalp-animasyon/assets/og-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My Universe">
<meta name="twitter:description" content="My Universe — a glowing 3D heart, beating in its own galaxy.">

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene" role="img" aria-label="A glowing three-dimensional heart, drawn as a single ribbon of light, beating slowly in a field of stars."></canvas>

<!-- Shown only when WebGL is missing or the module fails to load. Everything
     it needs is CSS, so it works with no scripting at all. -->
<div id="fallback" aria-hidden="true"><span class="fallback-heart"></span></div>

<div id="overlay">
  <h1 id="title">My Universe</h1>
  <p id="subtitle">In every lifetime, I'd find you again</p>
</div>

<p id="hint"><span lang="tr">dokun ya da fareyle gez &middot; kaydırarak yakınlaş</span></p>

<button id="share" type="button" hidden>share</button>
<p id="share-status" class="visually-hidden" role="status" aria-live="polite"></p>

<p class="visually-hidden">
  Move the pointer, or tilt your phone, to lean the view. Scroll or pinch to
  zoom. Drag to spin the heart. Tap it to scatter sparks. Nothing here is
  required — the piece plays on its own.
</p>

<noscript>
  <p class="noscript-note">
    This piece is drawn live in 3D and needs JavaScript to run.
    With it switched off, only the words remain.
  </p>
</noscript>

<script type="module" src="script.js"></script>
</body>
</html>
